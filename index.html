<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>منصة الأستاذ غزوان محمد - الفيزياء</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<!-- Firebase SDKs (Compat) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
:root{
  --bg: #f8fafc;
  --card: #ffffff;
  --ink: #0f172a;
  --mut: #64748b;
  --line: #e2e8f0;
  --pri: #2563eb;
  --pri-gradient: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  --gold: #d97706;
  --gold-gradient: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  --ok: #10b981;
  --bad: #ef4444;
  --warn: #f59e0b;
  --hd: linear-gradient(135deg, #0f172a 18%, #1e293b 100%);
  --sh: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
  --soft: #f1f5f9;
  --radius: 16px;
}
[data-theme=dark]{
  --bg: #030712;
  --card: #111827;
  --ink: #f9fafb;
  --mut: #9ca3af;
  --line: #1f2937;
  --pri: #3b82f6;
  --pri-gradient: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
  --hd: linear-gradient(135deg, #111827 0%, #030712 100%);
  --sh: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
  --soft: #1f2937;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',sans-serif;transition:background .3s,color .3s;min-height:100vh}
body::before{content:"";position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at 10% 10%, rgba(37, 99, 235, 0.06), transparent 40%), radial-gradient(circle at 90% 90%, rgba(217, 119, 6, 0.06), transparent 40%);pointer-events:none;z-index:-1}

h1,h2,h3{font-family:'Reem Kufi',sans-serif;margin:0}
.num{font-family:'Tajawal',sans-serif}

@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
@keyframes grow{from{width:0}}
@keyframes spin{to{transform:rotate(360deg)}}

header{background:var(--hd);color:#fff;display:flex;align-items:center;gap:14px;padding:14px 24px;position:sticky;top:0;z-index:10;box-shadow:var(--sh);backdrop-filter:blur(10px)}
header h1{flex:1;font-size:1.25rem;font-weight:700;letter-spacing:-0.5px}

.av{width:46px;height:46px;border-radius:50%;border:2px solid var(--gold);object-fit:cover;cursor:pointer;transition:transform .2s}
.av:hover{transform:scale(1.05)}

button,.btn{font-family:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 18px;background:var(--pri-gradient);color:#fff;font-weight:600;font-size:.95rem;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 12px rgba(37,99,235,0.2);transition:all .2s ease}
button:hover,.btn:hover{filter:brightness(1.08);transform:translateY(-2px);box-shadow:0 6px 15px rgba(37,99,235,0.3)}
button:active,.btn:active{transform:scale(0.97)}
button.alt{background:var(--soft);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
button.alt:hover{background:var(--line);box-shadow:none}
.g{background:var(--gold-gradient);box-shadow:0 4px 12px rgba(217,119,6,0.2)}
.g:hover{box-shadow:0 6px 15px rgba(217,119,6,0.3)}

main{max-width:1050px;margin:auto;padding:24px 16px}
main>*{animation:up .4s cubic-bezier(0.16, 1, 0.3, 1) both}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--sh);transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-2px)}

.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:20px;padding:4px;scrollbar-width:none}
.tabs button{background:var(--card);color:var(--ink);border:1px solid var(--line);white-space:nowrap;border-radius:99px;box-shadow:none;padding:8px 16px;font-weight:500}
.tabs button.on{background:var(--pri-gradient);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(37,99,235,0.25)}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px}
.stat{text-align:center;padding:18px 14px;border-radius:var(--radius);background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);border-top:5px solid var(--gold);animation:pop .4s both}
.stat b{display:block;font-size:2.2rem;font-family:'Tajawal',sans-serif;margin-top:6px;color:var(--pri)}

input,select,textarea{width:100%;padding:12px 16px;border:1px solid var(--line);border-radius:12px;font:inherit;margin-bottom:12px;background:var(--soft);color:var(--ink);transition:all .2s}
input:focus,textarea:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 4px rgba(37,99,235,0.15);background:var(--card)}

.login{max-width:440px;margin:6vh auto;padding:30px}
.login .av{width:90px;height:90px;margin:0 auto 16px;display:block}

img.th{width:100%;max-height:300px;object-fit:contain;background:var(--soft);border-radius:12px;cursor:zoom-in;border:1px solid var(--line)}

.ov{position:fixed;inset:0;background:rgba(0, 0, 0, 0.6);backdrop-filter:blur(5px);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto;animation:up .25s both}
.box{background:var(--card);color:var(--ink);border-radius:20px;padding:24px;max-width:900px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 25px 50px -12px rgba(0, 0, 0, 0.25);animation:pop .3s both}

.tag{padding:4px 12px;border-radius:30px;color:#fff;font-size:0.85rem;font-weight:600}
.ok{background:#10b981}.bad{background:#ef4444}.warn{background:#f59e0b}.pen{background:#64748b}

table{width:100%;border-collapse:collapse}
td,th{padding:12px 16px;border-bottom:1px solid var(--line);text-align:right;font-size:.95rem;white-space:nowrap}
th{font-weight:700;color:var(--mut)}
tr:hover td{background:var(--soft)}

canvas{width:100%;touch-action:none;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:crosshair}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.tbl{overflow-x:auto}
.mut{color:var(--mut);font-size:.9rem}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px;animation:grow 1s both}

.sync-badge{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;padding:4px 10px;border-radius:99px;background:rgba(16,185,129,0.15);color:#10b981;border:1px solid rgba(16,185,129,0.3)}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#10b981;box-shadow:0 0 8px #10b981}
.loader{width:36px;height:36px;border:3px solid var(--line);border-top-color:var(--pri);border-radius:50%;animation:spin .8s linear infinite;margin:40px auto}

@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="app"><div class="loader"></div></div>

<script>
// إعدادات Firebase الخاصة بمنصة الأستاذ غزوان محمد
const firebaseConfig = {
  apiKey: "AIzaSyB9aXajgs4jR-ey2jFIUbmtpTyS-moRLD4",
  authDomain: "ghazwan-d2d74.firebaseapp.com",
  databaseURL: "https://ghazwan-d2d74-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "ghazwan-d2d74",
  storageBucket: "ghazwan-d2d74.firebasestorage.app",
  messagingSenderId: "734447945750",
  appId: "1:734447945750:web:73929afc2705a3abcf4d37",
  measurementId: "G-75JBE09M9Z"
};

firebase.initializeApp(firebaseConfig);
const database = firebase.database();

document.documentElement.dataset.theme = localStorage.getItem('gz_theme') || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
const $ = s => document.querySelector(s);
const themeIcon = () => document.documentElement.dataset.theme === 'dark' ? '☀️' : '🌙';
const themeBtn = () => `<button class="alt tb" onclick="toggleTheme()" title="تبديل المظهر">${themeIcon()}</button>`;
function toggleTheme() {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  localStorage.setItem('gz_theme', t);
  document.querySelectorAll('.tb').forEach(b => b.textContent = themeIcon());
}

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DEFAULT_DB = { st: [], hw: [], sub: [], nt: [] };
let db = JSON.parse(JSON.stringify(DEFAULT_DB));
let isReady = false;

const save = () => {
  return database.ref('platform_data').set(db).catch(e => {
    alert('حدث خطأ أثناء المزامنة مع السحابة: ' + e.message);
  });
};

let me = JSON.parse(localStorage.getItem('gz_me') || 'null');
let tab = '';

// اسم الصورة المرفوعة في مستودع GitHub بجانب index.html
const PHOTO = 'IMG_2042.jpeg';

const S = { ok: 'صح', bad: 'خطأ', warn: 'إنذار' };
const fix = s => s.replace(/[أإآ]/g, 'ا').replace(/\s+/g, ' ').trim();
const when = t => new Date(t).toLocaleString('ar-IQ', { weekday: 'long', day: 'numeric', month: 'numeric', hour: 'numeric', minute: '2-digit' });
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const shrink = (f, m) => new Promise(r => {
  const i = new Image();
  i.onload = () => {
    const k = Math.min(1, m / Math.max(i.width, i.height)), c = document.createElement('canvas');
    c.width = i.width * k; c.height = i.height * k;
    c.getContext('2d').drawImage(i, 0, 0, c.width, c.height);
    r(c.toDataURL('image/jpeg', .78));
  };
  i.src = URL.createObjectURL(f);
});
const modal = h => {
  const o = document.createElement('div');
  o.className = 'ov';
  o.innerHTML = '<div class="box">' + h + '</div>';
  o.onclick = e => { if (e.target === o) o.remove(); };
  document.body.appendChild(o);
  return o;
};
const zoom = src => modal(`<img src="${src}" style="width:100%;border-radius:12px"><br><button class="alt" style="width:100%;margin-top:14px" onclick="this.closest('.ov').remove()">إغلاق</button>`);
const info = () => modal(`<div style="text-align:center"><img src="${PHOTO}" style="width:120px;height:120px;border-radius:50%;object-fit:cover;border:3px solid var(--gold);box-shadow:0 8px 20px rgba(0,0,0,0.15)"><h2 style="margin:14px 0 6px">الأستاذ غزوان محمد</h2><p class="mut" style="margin-bottom:20px">مدرّس مادة الفيزياء · السادس العلمي</p><button class="g" style="width:100%" onclick="this.closest('.ov').remove()">إغلاق</button></div>`);
const go = t => { tab = t; render(); };
const tabs = T => '<div class="tabs">' + T.map(a => `<button class="${tab === a[0] ? 'on' : ''}" onclick="go('${a[0]}')">${a[1]}</button>`).join('') + '</div>';
const stats = A => '<div class="grid">' + A.map(a => `<div class="stat" ${a[2] ? `style="border-top-color:var(--${a[2]})"` : ''}><b>${a[1]}</b>${a[0]}</div>`).join('') + '</div>';

function initRealtimeSync() {
  database.ref('platform_data').on('value', snapshot => {
    const data = snapshot.val() || {};
    db = {
      st: Array.isArray(data.st) ? data.st : Object.values(data.st || {}),
      hw: Array.isArray(data.hw) ? data.hw : Object.values(data.hw || {}),
      sub: Array.isArray(data.sub) ? data.sub : Object.values(data.sub || {}),
      nt: Array.isArray(data.nt) ? data.nt : Object.values(data.nt || {})
    };
    isReady = true;
    render();
  });
}

function login() {
  $('#app').innerHTML = `<div style="padding:16px" class="row"><span style="flex:1"></span>${themeBtn()}</div><div class="card login"><div style="text-align:center"><img src="${PHOTO}" class="av" onclick="info()"><h2 style="margin:10px 0 6px">منصة الأستاذ غزوان محمد</h2><p class="mut" style="margin-bottom:20px">سجّل معلوماتك للمتابعة والدراسة</p></div><input id="n" placeholder="الاسم الثلاثي"><input id="g" placeholder="الصف"><input id="s" placeholder="الشعبة"><input id="k" placeholder="المدرسة"><button class="g" style="width:100%;margin-top:6px" onclick="enter()">دخول المنصة</button></div>`;
}

async function enter() {
  const n = fix($('#n').value), g = $('#g').value.trim(), s = $('#s').value.trim(), k = $('#k').value.trim();
  if (n === 'غزوان محمد' && !g && !s && !k) {
    me = { t: 1 };
  } else {
    if (n.split(' ').length < 3 || !g || !s || !k) return alert('أكمل جميع الحقول واكتب الاسم الثلاثي بدقة');
    let st = db.st.find(x => x.n === n && x.g === g && x.s === s && x.k === k);
    if (!st) {
      st = { id: uid(), n, g, s, k, no: db.st.length + 1, d: Date.now() };
      db.st.push(st);
      await save();
    }
    me = { id: st.id };
  }
  localStorage.setItem('gz_me', JSON.stringify(me));
  tab = '';
  render();
}

function out() {
  localStorage.removeItem('gz_me');
  me = null;
  tab = '';
  render();
}

function render() {
  if (!isReady) return;
  if (!me) return login();
  const t = me.t, st = t ? null : db.st.find(x => x.id === me.id);
  if (!t && !st) {
    me = null;
    localStorage.removeItem('gz_me');
    return login();
  }
  $('#app').innerHTML = `<header><img class="av" src="${PHOTO}" onclick="info()"><h1>${t ? 'لوحة تحكم الأستاذ' : 'منصة الأستاذ غزوان محمد'}</h1><span class="sync-badge"><span class="sync-dot"></span>متصل سحابياً</span>${themeBtn()}<button class="alt" onclick="out()">خروج</button></header><main>${t ? teacher() : student(st)}</main>`;
}

function teacher() {
  tab = tab || 'ov';
  const pend = db.sub.filter(x => !x.s).length;
  const rec = db.sub.slice().sort((a, b) => b.t - a.t).slice(0, 5).map(s => {
    const p = db.st.find(x => x.id === s.st) || { n: '؟' };
    return `<div class="row" style="padding:10px 0;border-bottom:1px solid var(--line)"><b style="flex:1">${esc(p.n)}</b><span class="mut num">${when(s.t)}</span><span class="tag ${s.s || 'pen'}">${s.s ? S[s.s] : 'جديد'}</span></div>`;
  }).join('') || '<p class="mut">لا توجد حلول مرفوعة بعد</p>';

  let h = tabs([['ov', '🏠 نظرة عامة'], ['st', '👥 الطلبة'], ['hw', '📚 الواجبات'], ['sol', '📝 حلول الطلبة'], ['nt', '📢 التبليغات']]);

  if (tab === 'ov') {
    h += stats([
      ['الطلبة المسجلين', db.st.length],
      ['الواجبات', db.hw.length],
      ['إجمالي الحلول', db.sub.length],
      ['بانتظار التصحيح', pend, 'warn']
    ]) + `<div class="card"><h3 style="margin-bottom:10px">آخر الحلول المستلمة</h3>${rec}</div>`;
  }
  if (tab === 'st') {
    h += `<div class="card tbl"><table><tr><th>الرقم</th><th>الاسم الثلاثي</th><th>الصف</th><th>الشعبة</th><th>المدرسة</th><th>الحلول</th></tr>${db.st.map(s => `<tr><td class="num">${s.no}</td><td><b>${esc(s.n)}</b></td><td>${esc(s.g)}</td><td>${esc(s.s)}</td><td>${esc(s.k)}</td><td class="num"><span class="tag pen">${db.sub.filter(x => x.st === s.id).length}</span></td></tr>`).join('')}</table>${db.st.length ? '' : '<p class="mut">لم يسجل أي طالب في المنصة بعد</p>'}</div>`;
  }
  if (tab === 'hw') {
    h += `<label class="btn g" style="margin-bottom:16px;width:100%;justify-content:center;padding:14px">+ رفع واجب جديد (صورة)<input type="file" accept="image/*" hidden onchange="pickHW(this)"></label>` +
      db.hw.slice().reverse().map(w => `<div class="card"><div class="row" style="margin-bottom:10px"><h3 style="flex:1">${esc(w.t)}</h3><span class="mut num">${when(w.d)}</span><button class="bad tag" onclick="delHW('${w.id}')">حذف الواجب</button></div><img class="th" src="${w.img}" onclick="zoom(this.src)"></div>`).join('');
  }
  if (tab === 'sol') {
    h += db.sub.slice().sort((a, b) => b.t - a.t).map(s => {
      const p = db.st.find(x => x.id === s.st) || { n: 'طالب غير معروف', g: '', s: '' };
      const w = db.hw.find(x => x.id === s.hw) || { t: 'واجب محذوف' };
      return `<div class="card"><div class="row"><b style="flex:1;font-size:1.05rem">${esc(p.n)}</b><span class="tag ${s.s || 'pen'}">${s.s ? S[s.s] : 'بانتظار التصحيح'}</span></div><div class="mut" style="margin:6px 0 12px">${esc(w.t)} · ${esc(p.g)} / ${esc(p.s)} · ${when(s.t)}</div><img class="th" src="${s.img}" onclick="zoom(this.src)"><div class="row" style="margin-top:14px"><button style="background:var(--ok)" onclick="mark('${s.id}','ok')">✔ صح</button><button style="background:var(--bad)" onclick="mark('${s.id}','bad')">✖ خطأ</button><button style="background:var(--warn)" onclick="mark('${s.id}','warn')">⚠ إنذار</button></div></div>`;
    }).join('') || '';
    if (!db.sub.length) h += '<p class="mut">لا توجد حلول مطلوبة حالياً</p>';
  }
  if (tab === 'nt') {
    h += `<div class="card"><textarea id="nx" rows="3" placeholder="اكتب تبليغاً هاماً لطلبة السادس العلمي..."></textarea><button class="g" onclick="addNT()">نشر التبليغ الآن</button></div>` +
      db.nt.slice().reverse().map(n => `<div class="card"><p style="margin:0 0 10px;white-space:pre-wrap;font-size:1.05rem">${esc(n.x)}</p><div class="row"><span class="mut num" style="flex:1">${when(n.d)}</span><button class="bad tag" onclick="delNT('${n.id}')">حذف</button></div></div>`).join('');
  }
  return h;
}

function student(st) {
  tab = tab || 'home';
  const mine = db.sub.filter(x => x.st === st.id), c = k => mine.filter(x => x.s === k).length;
  let h = `<div class="card row" style="gap:16px;background:var(--soft)"><div style="width:64px;height:64px;border-radius:50%;background:var(--gold-gradient);color:#fff;display:flex;align-items:center;justify-content:center;font:700 2rem 'Reem Kufi';box-shadow:0 6px 15px rgba(217,119,6,0.3)">${esc(st.n[0])}</div><div style="flex:1"><h2 style="font-size:1.3rem">${esc(st.n)}</h2><div class="mut">${esc(st.g)} · شعبة ${esc(st.s)} · ${esc(st.k)} · رقم التسجيل <span class="num">${st.no}</span></div></div></div>` +
    tabs([['home', '🏠 الرئيسية'], ['nt', '📢 التبليغات'], ['hw', '📚 الواجبات'], ['res', '📊 نتائجي وحلولي']]);

  if (tab === 'home') {
    const tot = mine.length, pc = tot ? Math.round(c('ok') / tot * 100) : 0;
    h += stats([
      ['الإجابات الصحيحة', c('ok'), 'ok'],
      ['الأخطاء', c('bad'), 'bad'],
      ['الإنذارات', c('warn'), 'warn'],
      ['قيد التصحيح', mine.filter(x => !x.s).length, 'pen']
    ]) + `<div class="card"><div class="row"><b style="flex:1">معدل دقة الحلول</b><span class="num" style="font-size:1.2rem;font-weight:700;color:var(--ok)">${pc}%</span></div><div class="bar" style="margin-top:10px"><i style="width:${pc}%"></i></div></div>` +
      (db.nt.length ? `<div class="card" style="border-right:5px solid var(--gold)"><h3 style="margin-bottom:8px">آخر تبليغ من الأستاذ</h3><p style="margin:0;white-space:pre-wrap">${esc(db.nt[db.nt.length - 1].x)}</p></div>` : '');
  }
  if (tab === 'res') {
    h += `<div class="card tbl"><table><tr><th>الواجب</th><th>وقت الإرسال</th><th>الحالة</th></tr>${mine.slice().sort((a, b) => b.t - a.t).map(m => {
      const w = db.hw.find(x => x.id === m.hw) || { t: '—' };
      return `<tr><td><b>${esc(w.t)}</b></td><td class="num">${when(m.t)}</td><td><span class="tag ${m.s || 'pen'}">${m.s ? S[m.s] : 'بانتظار التصحيح'}</span></td></tr>`;
    }).join('')}</table>${mine.length ? '' : '<p class="mut">لم تقم بإرسال أي حلول لغاية الآن</p>'}</div>`;
  }
  if (tab === 'nt') {
    h += db.nt.slice().reverse().map(n => `<div class="card"><p style="margin:0 0 8px;white-space:pre-wrap;font-size:1.05rem">${esc(n.x)}</p><span class="mut num">${when(n.d)}</span></div>`).join('') || '<p class="mut">لا توجد تبليغات حالياً</p>';
  }
  if (tab === 'hw') {
    h += db.hw.slice().reverse().map(w => {
      const m = mine.find(x => x.hw === w.id);
      return `<div class="card"><div class="row" style="margin-bottom:10px"><h3 style="flex:1">${esc(w.t)}</h3>${m ? `<span class="tag ${m.s || 'pen'}">${m.s ? S[m.s] : 'بانتظار التصحيح'}</span>` : ''}</div><img class="th" src="${w.img}" onclick="zoom(this.src)"><div class="row" style="margin-top:14px"><label class="btn g" style="flex:1;justify-content:center">${m ? 'تعديل الحل المرسل' : 'إرسال حل الواجب (صورة)'}<input type="file" accept="image/*" hidden onchange="sendSol(this,'${w.id}')"></label>${m ? `<span class="mut num">${when(m.t)}</span>` : ''}</div></div>`;
    }).join('') || '<p class="mut">لا توجد واجبات منزلية مرفوعة حالياً</p>';
  }
  return h;
}

async function pickHW(i) {
  const f = i.files[0];
  if (!f) return;
  const src = await shrink(f, 1100);
  i.value = '';
  editor(src);
}

function editor(src) {
  const o = modal(`<h3 style="margin-bottom:12px">أداة تخطيط وتعديل الواجب</h3><input id="ht" placeholder="عنوان الواجب (مثال: اختبار الفصل الأول)"><div class="row" style="margin-bottom:10px"><input type="color" id="pc" value="#2563eb" style="width:50px;padding:2px;height:40px;margin:0"><input type="range" id="pw" min="2" max="14" value="4" style="width:140px;margin:0"><button class="alt" onclick="ed.undo()">تراجع</button><button class="alt" onclick="ed.clear()">مسح الكل</button></div><canvas id="cv"></canvas><div class="row" style="margin-top:14px"><button class="g" style="flex:1;justify-content:center" onclick="ed.done()">نشر الواجب للطلبة</button><button class="alt" onclick="this.closest('.ov').remove()">إلغاء</button></div>`);
  const i = new Image();
  i.onload = () => {
    const c = $('#cv'), x = c.getContext('2d');
    c.width = i.width; c.height = i.height;
    let L = [], cur = null;
    const draw = () => {
      x.clearRect(0, 0, c.width, c.height); x.drawImage(i, 0, 0); x.lineCap = x.lineJoin = 'round';
      L.concat(cur ? [cur] : []).forEach(s => {
        x.strokeStyle = s.c; x.lineWidth = s.w; x.beginPath();
        s.p.forEach((q, k) => k ? x.lineTo(q[0], q[1]) : x.moveTo(q[0], q[1]));
        if (s.p.length == 1) x.lineTo(s.p[0][0] + .1, s.p[0][1]);
        x.stroke();
      });
    };
    const pt = e => {
      const r = c.getBoundingClientRect();
      return [(e.clientX - r.left) * c.width / r.width, (e.clientY - r.top) * c.height / r.height];
    };
    c.onpointerdown = e => { c.setPointerCapture(e.pointerId); cur = { c: $('#pc').value, w: $('#pw').value * c.width / 700, p: [pt(e)] }; draw(); };
    c.onpointermove = e => { if (cur) { cur.p.push(pt(e)); draw(); } };
    c.onpointerup = () => { if (cur) { L.push(cur); cur = null; draw(); } };
    window.ed = {
      undo: () => { L.pop(); draw(); },
      clear: () => { L = []; draw(); },
      done: async () => {
        const t = $('#ht').value.trim();
        if (!t) return alert('يرجى كتابة عنوان الواجب أولاً');
        db.hw.push({ id: uid(), t, img: c.toDataURL('image/jpeg', .85), d: Date.now() });
        o.remove();
        tab = 'hw';
        await save();
      }
    };
    draw();
  };
  i.src = src;
}

async function delHW(id) {
  if (!confirm('هل تريد حذف هذا الواجب وحلوله نهائياً؟')) return;
  db.hw = db.hw.filter(x => x.id !== id);
  db.sub = db.sub.filter(x => x.hw !== id);
  await save();
}

async function mark(id, v) {
  const s = db.sub.find(x => x.id === id);
  if (s) {
    s.s = v;
    await save();
  }
}

async function addNT() {
  const x = $('#nx').value.trim();
  if (!x) return;
  db.nt.push({ id: uid(), x, d: Date.now() });
  $('#nx').value = '';
  await save();
}

async function delNT(id) {
  if (!confirm('حذف هذا التبليغ؟')) return;
  db.nt = db.nt.filter(x => x.id !== id);
  await save();
}

async function sendSol(i, h) {
  const f = i.files[0];
  if (!f) return;
  const img = await shrink(f, 1000);
  const o = db.sub.find(x => x.st === me.id && x.hw === h);
  if (o && o.s) return alert('عذراً، لا يمكنك تعديل الحل لأنه تم تصحيحه مسبقاً من قِبل الأستاذ');
  if (o) {
    o.img = img;
    o.t = Date.now();
  } else {
    db.sub.push({ id: uid(), hw: h, st: me.id, img, t: Date.now(), s: null });
  }
  await save();
}

initRealtimeSync();
</script>
</body>
</html>
